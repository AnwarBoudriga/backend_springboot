spring.application.name=proctoring-service
server.port=${PORT:8081}

# Base H2 (fichier) : les données survivent au redémarrage. Console : http://localhost:8081/h2-console
spring.datasource.url=${SPRING_DB_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/psytech_pro?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${SPRING_DB_USER:sa}
spring.datasource.password=${SPRING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# --- Secrets partagés avec le backend Node (variables d'environnement, jamais en clair ici) ---
# JWT_SECRET   = EXACTEMENT la même valeur que JWT_SECRET dans le .env de Node
# PROCTORING_SERVICE_KEY = clé secrète que Node envoie dans l'en-tête X-Service-Key
proctoring.jwt-secret=${JWT_SECRET:changez-moi-avec-une-longue-chaine-aleatoire-de-32-caracteres-min}
proctoring.service-key=${PROCTORING_SERVICE_KEY:une-cle-de-service-1234567890}
# --- API externe gratuite de géolocalisation IP (même principe que OpenWeatherMap au TP6) ---
proctoring.geo.url=${GEO_API_URL:https://ipwho.is/}

# CORS : utile seulement si l'app Flutter tourne en web (ex: http://localhost:5000)
proctoring.cors-origins=${CORS_ORIGIN:*}

# true uniquement derrière un reverse proxy de confiance (sinon un candidat peut falsifier son IP)
proctoring.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
